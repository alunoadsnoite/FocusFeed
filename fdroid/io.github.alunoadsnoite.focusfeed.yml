Categories:
  - Time
License: MIT
AuthorName: alunoadsnoite
SourceCode: https://github.com/alunoadsnoite/FocusFeed
IssueTracker: https://github.com/alunoadsnoite/FocusFeed/issues
Changelog: https://github.com/alunoadsnoite/FocusFeed/releases

AutoName: FocusFeed

RepoType: git
Repo: https://github.com/alunoadsnoite/FocusFeed.git

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.47.7
    rm:
      - ios
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export FOCUSFEED_UNSIGNED=1
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.0
CurrentVersionCode: 1
