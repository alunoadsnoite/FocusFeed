Changelog: https://github.com/alunoadsnoite/FocusFeed/releases

AutoName: FocusFeed

RepoType: git
Repo: https://github.com/alunoadsnoite/FocusFeed.git

Builds:
  - versionName: 1.0.1
    versionCode: 1002
    commit: 635018efb6f288605f7e40a0464ef522762ca86e
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
    prebuild:
      - export flutterVersion=$(sed -n -E "s/.*revision:\ \"(.*)\"/\1/p" .metadata)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export FOCUSFEED_UNSIGNED=1
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm

  - versionName: 1.0.1
