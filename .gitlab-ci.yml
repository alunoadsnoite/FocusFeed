image: ghcr.io/cirruslabs/flutter:stable
stages:
  - test
variables:
  FOCUSFEED_UNSIGNED: '1'
  PUB_CACHE: '$CI_PROJECT_DIR/.pub-cache'
before_script:
  - git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git /tmp/focusfeed-flutter
  - test "$(git -C /tmp/focusfeed-flutter rev-parse HEAD)" = "abaf9c523780a608bd46686fd5e53740a07077f8"
  - export PATH="/tmp/focusfeed-flutter/bin:$PATH"
cache:
  paths:
    - .pub-cache/
checks:
  stage: test
  script:
    - flutter pub get --enforce-lockfile
    - flutter analyze
    - flutter test
    - flutter build apk --debug
    - cd android && ./gradlew :app:testDebugUnitTest && cd ..
    - flutter build apk --release
  artifacts:
    paths:
      - build/app/outputs/flutter-apk/app-release.apk
    expire_in: 14 days
